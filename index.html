<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>有些话，想当面说给你听</title>
<style>
  :root{
    --pink: #ff5d7d;
    --pink-soft: #ffb0c0;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; overflow:hidden; background:#0a0712; }
  body{
    font-family: "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    color:#fff; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* 背景画布：爱心粒子 */
  #bg{
    position:fixed; inset:0; display:block; width:100%; height:100%;
  }
  /* 氛围光晕 */
  .glow{
    position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(58% 48% at 50% 42%, rgba(255,93,125,.20), transparent 72%),
      radial-gradient(85% 70% at 50% 112%, rgba(122,64,214,.22), transparent 72%);
  }

  .stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:20px; padding:28px; text-align:center;
    transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1);
  }
  .stage.hide{ opacity:0; transform:scale(.94); pointer-events:none; }

  /* ===== 打字阶段 ===== */
  .typing{
    max-width: 19em;
    font-size: clamp(19px, 4.4vw, 32px);
    line-height: 2;
    letter-spacing: 2px;
    white-space: pre-wrap;
    text-shadow: 0 0 22px rgba(255,93,125,.6), 0 2px 14px rgba(0,0,0,.9);
    min-height: 6em;
    display:flex; flex-wrap:wrap;
    justify-content:center; align-items:center;
  }
  .caret{
    display:inline-block; width:2px; height:1em;
    background: var(--pink); vertical-align:-2px;
    margin-left:3px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ===== 提问阶段 ===== */
  #stage2 .to{
    font-size: clamp(15px, 3.6vw, 20px);
    letter-spacing: 6px;
    color: var(--pink-soft);
    opacity:.85;
  }
  #stage2 .ask{
    font-size: clamp(26px, 7.6vw, 54px);
    letter-spacing: 3px;
    font-weight: 600;
    text-shadow: 0 0 28px rgba(255,93,125,.75), 0 0 70px rgba(255,93,125,.35), 0 3px 16px rgba(0,0,0,.95);
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.035); }
  }
  #stage2 .sub{
    font-size: clamp(13px, 3.2vw, 16px);
    color: rgba(255,255,255,.62);
    letter-spacing: 2px;
    text-shadow: 0 2px 12px rgba(0,0,0,.9);
  }

  .btns{
    display:flex; gap:22px; margin-top: 14px;
    align-items:center; justify-content:center;
    flex-wrap: wrap;
  }
  .btn{
    border:0; cursor:pointer;
    font-family: inherit;
    font-size: clamp(16px, 4.2vw, 20px);
    letter-spacing: 2px;
    padding: 15px 44px;
    border-radius: 999px;
    transition: transform .35s cubic-bezier(.2,.9,.3,1.4), box-shadow .3s, opacity .3s, background .3s;
    outline:none;
  }
  .btn-yes{
    color:#3a0011; font-weight:700;
    background: linear-gradient(135deg,#ffd3dd,#ff7a97 55%,#ff5d7d);
    box-shadow: 0 0 0 1px rgba(255,255,255,.18) inset, 0 9px 32px rgba(255,93,125,.55);
  }
  .btn-yes:hover{ box-shadow: 0 0 0 1px rgba(255,255,255,.26) inset, 0 12px 42px rgba(255,93,125,.8); }
  .btn-no{
    color: rgba(255,255,255,.72);
    background: rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(6px);
  }
  #tipline{
    font-size: clamp(12px, 3vw, 15px);
    color: rgba(255,255,255,.38);
    min-height: 1.4em;
    letter-spacing: 1px;
  }

  /* ===== 结局阶段 ===== */
  #stage3 .big{
    font-size: clamp(30px, 8.4vw, 62px);
    font-weight: 600;
    letter-spacing: 4px;
    text-shadow: 0 0 34px rgba(255,93,125,.8);
    animation: breathe 3.4s ease-in-out infinite;
  }
  #stage3 .lines{
    display:flex; flex-direction:column; gap:12px;
    font-size: clamp(14px, 3.5vw, 18px);
    letter-spacing: 2px;
    color: rgba(255,255,255,.85);
    line-height: 1.9;
    text-shadow: 0 2px 14px rgba(0,0,0,.95);
  }
  #stage3 .lines span{ opacity:0; transform: translateY(10px); animation: rise .8s ease forwards; }
  @keyframes rise{ to{ opacity:1; transform:none; } }
  #stage3 .sign{
    margin-top: 8px;
    font-size: clamp(12px, 3vw, 15px);
    color: var(--pink-soft);
    letter-spacing: 3px;
    opacity:0; animation: rise .8s ease forwards;
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="glow"></div>

  <!-- 第一幕：打字机 -->
  <div class="stage" id="stage1">
    <div class="typing"><span id="typed"></span><span class="caret"></span></div>
  </div>

  <!-- 第二幕：提问 -->
  <div class="stage hide" id="stage2">
    <div class="to" id="herName">致 那个让心跳不听话的人</div>
    <div class="ask">做我女朋友，好吗？</div>
    <div class="sub">这句话，我在心里排练了很多遍</div>
    <div class="btns">
      <button class="btn btn-yes" id="yesBtn">愿 意</button>
      <button class="btn btn-no" id="noBtn">再想想</button>
    </div>
    <div id="tipline"></div>
  </div>

  <!-- 第三幕：答应之后 -->
  <div class="stage hide" id="stage3">
    <div class="big">谢谢你 ❤</div>
    <div class="lines">
      <span style="animation-delay:.5s">从今天起，晚风、月亮和星星，都想分你一半。</span>
      <span style="animation-delay:1.1s">你负责被喜欢，我负责一直喜欢。</span>
      <span style="animation-delay:1.7s">余生很长，请多指教。</span>
    </div>
    <div class="sign" style="animation-delay:2.4s">—— 一个终于鼓起勇气的人</div>
  </div>

<script>
/* =========================================================
   想改的东西，基本都在下面这几行
   ========================================================= */
const CONFIG = {
  // 打字内容，一行一句；改这里就是改开场白
  script: [
    "有人说，喜欢一个人是藏不住的。",
    "我练了很久，想把这句话藏好。",
    "可每次见到你，眼睛就先替我回答了。",
    "所以今天，我不藏了。"
  ],
  // 她的名字或称呼，会显示在提问上方
  herName: "致 那个让心跳不听话的人",
  // 点“再想想”时的提示语，会依次出现
  tips: [
    "别这样，手抖了。",
    "这个按钮好像不太听话……",
    "要不，你再看看左边那个？",
    "好吧，我承认：答案只有一个。"
  ]
};
/* ========================================================= */

const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
const stage1 = document.getElementById('stage1');
const stage2 = document.getElementById('stage2');
const stage3 = document.getElementById('stage3');
const typedEl = document.getElementById('typed');
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const tipline = document.getElementById('tipline');

document.getElementById('herName').textContent = CONFIG.herName;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------- 画布尺寸 ---------- */
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildHeart();
}
window.addEventListener('resize', resize);

/* ---------- 发光粒子贴图（只画一次，后面重复贴，省性能） ---------- */
const sprite = document.createElement('canvas');
sprite.width = sprite.height = 64;
(function(){
  const c = sprite.getContext('2d');
  const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,180,200,.95)');
  g.addColorStop(0.6, 'rgba(255,93,125,.35)');
  g.addColorStop(1, 'rgba(255,60,100,0)');
  c.fillStyle = g;
  c.beginPath(); c.arc(32, 32, 32, 0, Math.PI * 2); c.fill();
})();

/* ---------- 心形粒子 ---------- */
const HEART_COUNT = 900;
let particles = [];
let mode = 'form';          // form 聚拢 / burst 炸开 / calm 余波
let CY = 0, SCALE = 1;

function heartPoint(t){
  // 经典心形曲线
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x, y };
}

// 把心形曲线离散成屏幕坐标的多边形，用来判断“点是否在心内部”
function heartPolygon(){
  const poly = [];
  const steps = 220;
  for (let i = 0; i < steps; i++){
    const t = i / steps * Math.PI * 2;
    const p = heartPoint(t);
    poly.push({ x: W / 2 + p.x * SCALE, y: CY - p.y * SCALE });
  }
  return poly;
}

function insidePolygon(px, py, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i].x, yi = poly[i].y;
    const xj = poly[j].x, yj = poly[j].y;
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)){
      inside = !inside;
    }
  }
  return inside;
}

function buildHeart(){
  SCALE = Math.min(W * 0.92, H * 0.85) / 34;
  CY = H * 0.46;
  const poly = heartPolygon();

  // 包围盒
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of poly){
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }

  particles = [];
  const EDGE_RATIO = 0.3;   // 三成粒子贴在轮廓上，让边缘更清晰

  for (let i = 0; i < HEART_COUNT; i++){
    const onEdge = Math.random() < EDGE_RATIO;
    let tx, ty;

    if (onEdge){
      // 轮廓上的点
      const p = poly[Math.floor(Math.random() * poly.length)];
      tx = p.x + rand(-1.5, 1.5);
      ty = p.y + rand(-1.5, 1.5);
    } else {
      // 内部均匀撒点（拒绝采样，避免中间堆成一条）
      let ok = false;
      for (let k = 0; k < 60 && !ok; k++){
        const rx = rand(minX, maxX);
        const ry = rand(minY, maxY);
        if (insidePolygon(rx, ry, poly)){
          tx = rx; ty = ry; ok = true;
        }
      }
      if (!ok){ tx = W / 2; ty = CY; }
    }

    particles.push({
      x: rand(0, W), y: rand(0, H),
      tx, ty,
      r: onEdge ? rand(2.2, 3.8) : rand(1.1, 2.4),
      a: onEdge ? rand(0.75, 1) : rand(0.22, 0.6),
      ph: rand(0, Math.PI * 2),
      sp: rand(0.6, 1.8),
      vx: 0, vy: 0
    });
  }
  mode = 'form';
}

/* ---------- 飘落的心 ---------- */
let rain = [];
function spawnRain(n){
  for (let i = 0; i < n; i++){
    rain.push({
      x: rand(-20, W + 20),
      y: rand(-H * 0.3, -20),
      vy: rand(1.2, 3.2),
      vx: rand(-0.6, 0.6),
      size: rand(10, 26),
      rot: rand(-0.4, 0.4),
      vr: rand(-0.02, 0.02),
      a: rand(0.45, 0.9),
      hue: Math.random() < 0.5 ? '#ff6b88' : '#ffd0dc'
    });
  }
}

/* ---------- 主循环 ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(2, (now - last) / 16.67);
  last = now;

  ctx.clearRect(0, 0, W, H);

  // 深空底
  const bgGrad = ctx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, Math.max(W, H) * 0.75);
  bgGrad.addColorStop(0, 'rgba(30,14,40,1)');
  bgGrad.addColorStop(1, 'rgba(6,4,12,1)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 粒子
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles){
    if (mode === 'burst'){
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.a *= 0.988;
      if (p.a < 0.02) continue;
    } else {
      const stiff = mode === 'calm' ? 0.012 : 0.05;
      p.x += (p.tx - p.x) * stiff * dt;
      p.y += (p.ty - p.y) * stiff * dt;
      p.x += Math.sin(now / 900 + p.ph) * 0.45 * dt;
      p.y += Math.cos(now / 1100 + p.ph) * 0.45 * dt;
    }
    const size = p.r * 5.2;
    ctx.globalAlpha = p.a * (0.75 + 0.25 * Math.sin(now / 700 + p.ph));
    ctx.drawImage(sprite, p.x - size / 2, p.y - size / 2, size, size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // 飘落的心
  for (const h of rain){
    h.x += h.vx * dt;
    h.y += h.vy * dt;
    h.rot += h.vr * dt;
    if (h.y > H + 40){
      h.y = -30;
      h.x = rand(-20, W + 20);
    }
    ctx.save();
    ctx.globalAlpha = h.a;
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    ctx.fillStyle = h.hue;
    ctx.font = h.size + 'px serif';
    ctx.fillText('❤', 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}

/* ---------- 打字机 ---------- */
async function typeAll(){
  await sleep(700);
  for (let i = 0; i < CONFIG.script.length; i++){
    const line = CONFIG.script[i];
    if (i > 0){ typedEl.textContent += '\n'; }
    for (const ch of line){
      typedEl.textContent += ch;
      await sleep(ch === '，' || ch === '。' ? 420 : rand(70, 145));
    }
    await sleep(600);
  }
  await sleep(1200);
  stage1.classList.add('hide');
  await sleep(700);
  stage2.classList.remove('hide');
}

/* ---------- “再想想”按钮逃跑 ---------- */
const NO_MAX = 4;          // 点几次之后彻底让路
let noCount = 0;
let moveSeed = 0;
let lastMove = 0;

// 让按钮跳开（鼠标悬停就会触发，但不会消耗“容忍次数”）
function jumpAway(){
  const now = Date.now();
  if (now - lastMove < 600) return;
  lastMove = now;
  moveSeed++;
  const shrink = Math.max(0.45, 1 - moveSeed * 0.09);
  const dx = (Math.random() < 0.5 ? -1 : 1) * rand(80, Math.min(250, W * 0.26));
  const dy = rand(-80, 80);
  noBtn.style.transform = `translate(${dx}px, ${dy}px) scale(${shrink})`;
}

// 真的点下去，才算“再想想”的次数
function refuseOnClick(){
  if (noCount >= NO_MAX) return;
  noCount++;
  noBtn.style.opacity = String(Math.max(0, 0.9 - noCount * 0.15));
  yesBtn.style.transform = `scale(${1 + noCount * 0.08})`;
  tipline.textContent = CONFIG.tips[Math.min(noCount - 1, CONFIG.tips.length - 1)];
  jumpAway();

  if (noCount >= NO_MAX){
    setTimeout(() => {
      noBtn.style.opacity = '0';
      noBtn.style.pointerEvents = 'none';
      tipline.textContent = '答案只有一个，别为难它了 😊';
    }, 350);
  }
}
noBtn.addEventListener('click', e => { e.preventDefault(); refuseOnClick(); });
noBtn.addEventListener('mouseenter', jumpAway);

/* ---------- 点“愿意” ---------- */
yesBtn.addEventListener('click', async () => {
  yesBtn.disabled = true;
  mode = 'burst';
  for (const p of particles){
    const ang = Math.atan2(p.y - CY, p.x - W / 2);
    const speed = rand(2, 9);
    p.vx = Math.cos(ang) * speed * rand(0.4, 1.2);
    p.vy = Math.sin(ang) * speed * rand(0.4, 1.2);
  }
  spawnRain(70);
  stage2.classList.add('hide');
  await sleep(800);
  stage3.classList.remove('hide');

  // 炸开后，爱心重新聚拢成心，作为背景静静发光
  setTimeout(() => {
    buildHeart();
    mode = 'calm';
    for (const p of particles){
      p.x = p.tx + rand(-W * 0.35, W * 0.35);
      p.y = p.ty + rand(-H * 0.35, H * 0.35);
    }
  }, 2200);
});

/* ---------- 启动 ---------- */
resize();
requestAnimationFrame(loop);
typeAll();
</script>
</body>
</html>

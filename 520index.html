<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>有些话，想当面说给你听</title>
<style>
  :root{
    --pink: #ff5d7d;
    --pink-soft: #ffb0c0;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; overflow:hidden; background:#0a0712; }
  body{
    font-family: "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    color:#fff; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* 背景画布：爱心粒子 */
  #bg{
    position:fixed; inset:0; display:block; width:100%; height:100%;
    pointer-events:none;
  }
  /* 氛围光晕 */
  .glow{
    position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(58% 48% at 50% 42%, rgba(255,93,125,.20), transparent 72%),
      radial-gradient(85% 70% at 50% 112%, rgba(122,64,214,.22), transparent 72%);
  }

  .stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:20px; padding:28px; text-align:center;
    transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1);
  }
  .stage.hide{ opacity:0; transform:scale(.94); pointer-events:none; }
  #stage1{ opacity:0; }
  #stage1.ready{ opacity:1; }
  #stage1.hide{ opacity:0; transform:scale(.94); pointer-events:none; }

  /* ===== 打字阶段 ===== */
  .typing{
    width: 100%;
    max-width: 23em;
    height: 62vh;
    font-size: clamp(15px, 3.4vw, 22px);
    line-height: 2.1;
    letter-spacing: 1.5px;
    white-space: pre-wrap;
    text-shadow: 0 0 22px rgba(255,93,125,.55), 0 2px 14px rgba(0,0,0,.95);
    overflow-y: auto;
    scrollbar-width: none;
    padding: 12px 0 10vh;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 100%);
  }
  .typing::-webkit-scrollbar{ display:none; }
  .caret{
    display:inline-block; width:2px; height:1em;
    background: var(--pink); vertical-align:-2px;
    margin-left:3px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ===== 提问阶段 ===== */
  #stage2 .to{
    font-size: clamp(15px, 3.6vw, 20px);
    letter-spacing: 6px;
    color: var(--pink-soft);
    opacity:.92;
    text-shadow: 0 1px 10px rgba(0,0,0,.95), 0 0 26px rgba(0,0,0,.9), 0 0 18px rgba(255,93,125,.6);
  }
  #stage2 .ask{
    font-size: clamp(26px, 7.6vw, 54px);
    letter-spacing: 3px;
    font-weight: 600;
    text-shadow: 0 0 28px rgba(255,93,125,.75), 0 0 70px rgba(255,93,125,.35), 0 3px 16px rgba(0,0,0,.95);
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.035); }
  }
  #stage2 .sub{
    font-size: clamp(13px, 3.2vw, 16px);
    color: rgba(255,255,255,.62);
    letter-spacing: 2px;
    text-shadow: 0 2px 12px rgba(0,0,0,.9);
  }

  .btns{
    display:flex; gap:22px; margin-top: 14px;
    align-items:center; justify-content:center;
    flex-wrap: wrap;
  }
  .btn{
    border:0; cursor:pointer;
    font-family: inherit;
    font-size: clamp(16px, 4.2vw, 20px);
    letter-spacing: 2px;
    padding: 15px 44px;
    border-radius: 999px;
    transition: transform .35s cubic-bezier(.2,.9,.3,1.4), box-shadow .3s, opacity .3s, background .3s;
    outline:none;
  }
  .btn-yes{
    color:#3a0011; font-weight:700;
    background: linear-gradient(135deg,#ffd3dd,#ff7a97 55%,#ff5d7d);
    box-shadow: 0 0 0 1px rgba(255,255,255,.18) inset, 0 9px 32px rgba(255,93,125,.55);
  }
  .btn-yes:hover{ box-shadow: 0 0 0 1px rgba(255,255,255,.26) inset, 0 12px 42px rgba(255,93,125,.8); }
  .btn-no{
    color: rgba(255,255,255,.72);
    background: rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(6px);
  }
  #tipline{
    font-size: clamp(12px, 3vw, 15px);
    color: rgba(255,255,255,.38);
    min-height: 1.4em;
    letter-spacing: 1px;
  }

  /* ===== 结局阶段 ===== */
  #stage3 .big{
    font-size: clamp(30px, 8.4vw, 62px);
    font-weight: 600;
    letter-spacing: 4px;
    text-shadow: 0 0 34px rgba(255,93,125,.8);
    animation: breathe 3.4s ease-in-out infinite;
  }
  #stage3 .lines{
    display:flex; flex-direction:column; gap:12px;
    font-size: clamp(14px, 3.5vw, 18px);
    letter-spacing: 2px;
    color: rgba(255,255,255,.85);
    line-height: 1.9;
    text-shadow: 0 2px 14px rgba(0,0,0,.95);
  }
  #stage3 .lines span{ opacity:0; transform: translateY(10px); animation: rise .8s ease forwards; }
  @keyframes rise{ to{ opacity:1; transform:none; } }
  #stage3 .sign{
    margin-top: 8px;
    font-size: clamp(12px, 3vw, 15px);
    color: var(--pink-soft);
    letter-spacing: 3px;
    opacity:0; animation: rise .8s ease forwards;
  }

  /* ===== 开场页：轻触开始 ===== */
  #splash{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    background: radial-gradient(60% 50% at 50% 45%, rgba(255,93,125,.16), transparent 70%);
    cursor:pointer;
    transition: opacity 1s ease;
  }
  #splash.hide{ opacity:0; pointer-events:none; }
  .tap{
    font-size: clamp(16px, 4vw, 24px);
    letter-spacing: 8px;
    color: rgba(255,255,255,.9);
    text-shadow: 0 0 26px rgba(255,93,125,.75), 0 2px 14px rgba(0,0,0,.9);
    animation: breathe 3.2s ease-in-out infinite;
  }
  .hint{
    font-size: clamp(11px, 2.8vw, 13px);
    letter-spacing: 2px;
    color: rgba(255,255,255,.45);
  }

  /* ===== 第四幕：不愿意 ===== */
  #stage4 .bye{
    font-size: clamp(18px, 4.6vw, 30px);
    letter-spacing: 3px;
    line-height: 2.1;
    color: rgba(255,255,255,.9);
    text-shadow: 0 0 24px rgba(255,93,125,.35), 0 2px 16px rgba(0,0,0,.95);
    opacity:0;
    transform: translateY(8px);
    transition: opacity 1.6s ease, transform 1.6s ease;
  }
  #stage4 .bye.on{ opacity:1; transform:none; }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="glow"></div>

  <!-- 开场页：轻触开始（同时解锁音频） -->
  <div id="splash">
    <div class="tap">轻 触 屏 幕</div>
    <div class="hint">🔊 有背景音乐，建议戴上耳机</div>
  </div>

  <!-- 第一幕：打字机 -->
  <div class="stage" id="stage1">
    <div class="typing" id="typeBox"><span id="typed"></span><span class="caret"></span></div>
  </div>

  <!-- 第二幕：提问 -->
  <div class="stage hide" id="stage2">
    <div class="to" id="herName">致 那个让心跳不听话的人</div>
    <div class="ask">做我的女朋友，好吗？</div>
    <div class="sub">给我一次机会</div>
    <div class="btns">
      <button class="btn btn-yes" id="yesBtn">愿 意</button>
      <button class="btn btn-no" id="noBtn">不愿意</button>
    </div>
  </div>

  <!-- 第三幕：答应之后 -->
  <div class="stage hide" id="stage3">
    <div class="big">谢谢你 ❤</div>
    <div class="lines">
      <span style="animation-delay:.5s">从今天起，晚风、月亮和星星，都想分你一半。</span>
      <span style="animation-delay:1.1s">你负责被喜欢，我负责一直喜欢。</span>
      <span style="animation-delay:1.7s">余生很长，请多指教。</span>
    </div>
    <div class="sign" style="animation-delay:2.4s">—— 一个终于鼓起勇气的人</div>
  </div>

  <!-- 第四幕：选择不愿意 -->
  <div class="stage hide" id="stage4">
    <div class="bye" id="byeText">尊重你的选择，<br>愿你以后生活愉快</div>
  </div>

<script>
/* =========================================================
   想改的东西，基本都在下面这几行
   ========================================================= */
const CONFIG = {
  // 打字内容，一行一句；改这里就是改开场白
  script: [
    "嗯……不知不觉，已经认识挺长时间了。",
    "我渐渐习惯了有你在的生活，",
    "习惯了晚上和你道晚安，",
    "也习惯了和你分享我的情绪。",
    "渐渐地，你在我心里占据了很大一部分。",
    "生活中能帮到你是我的荣幸。",
    "或许我今天的决定，对你来说很突然，",
    "但，这真的是我深思熟虑后的决定。",
    "我不太会表达，也没有真正谈过恋爱，",
    "不知道该怎么表达我对你的喜欢。",
    "你或许知道我其实是比较内向的，",
    "但生活必须使我慢慢强大起来，使我独当一面。",
    "十八岁，我成年了，我的十八岁寄予了我莫大的勇气。",
    "可岁月匆匆，我感觉到我的十八岁也快走到尽头。",
    "我怕过了这个时间，就再也不敢说出口，",
    "怕成为我最大的遗憾。",
    "可我也怕失败之后，从此形同陌路。",
    "可是时间，不会再给我慢慢思考的机会了。",
    "今天就算失败，我也迈出了这一步，",
    "或许以后就不会有那么大的遗憾。",
    "最后，我想说……"
  ],
  // 她的名字或称呼，会显示在提问上方
  herName: "致 敏",
  // 点“再想想”时的提示语，会依次出现
  tips: [
    "别这样，手抖了。",
    "这个按钮好像不太听话……",
    "要不，你再看看左边那个？",
    "好吧，我承认：答案只有一个。"
  ]
};
/* ========================================================= */

const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
const stage1 = document.getElementById('stage1');
const stage2 = document.getElementById('stage2');
const stage3 = document.getElementById('stage3');
const typedEl = document.getElementById('typed');
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');

document.getElementById('herName').textContent = CONFIG.herName;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------- 画布尺寸 ---------- */
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildHeart();
}
window.addEventListener('resize', resize);

/* ---------- 发光粒子贴图（只画一次，后面重复贴，省性能） ---------- */
const sprite = document.createElement('canvas');
sprite.width = sprite.height = 64;
(function(){
  const c = sprite.getContext('2d');
  const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,180,200,.95)');
  g.addColorStop(0.6, 'rgba(255,93,125,.35)');
  g.addColorStop(1, 'rgba(255,60,100,0)');
  c.fillStyle = g;
  c.beginPath(); c.arc(32, 32, 32, 0, Math.PI * 2); c.fill();
})();

/* ---------- 心形粒子 ---------- */
const HEART_COUNT = 900;
let particles = [];
let mode = 'form';          // form 聚拢 / burst 炸开 / calm 余波
let CY = 0, SCALE = 1;

function heartPoint(t){
  // 经典心形曲线
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x, y };
}

// 把心形曲线离散成屏幕坐标的多边形，用来判断“点是否在心内部”
function heartPolygon(){
  const poly = [];
  const steps = 220;
  for (let i = 0; i < steps; i++){
    const t = i / steps * Math.PI * 2;
    const p = heartPoint(t);
    poly.push({ x: W / 2 + p.x * SCALE, y: CY - p.y * SCALE });
  }
  return poly;
}

function insidePolygon(px, py, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i].x, yi = poly[i].y;
    const xj = poly[j].x, yj = poly[j].y;
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)){
      inside = !inside;
    }
  }
  return inside;
}

function buildHeart(){
  SCALE = Math.min(W * 0.92, H * 0.85) / 34;
  CY = H * 0.46;
  const poly = heartPolygon();

  // 包围盒
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of poly){
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }

  particles = [];
  const EDGE_RATIO = 0.3;   // 三成粒子贴在轮廓上，让边缘更清晰

  for (let i = 0; i < HEART_COUNT; i++){
    const onEdge = Math.random() < EDGE_RATIO;
    let tx, ty;

    if (onEdge){
      // 轮廓上的点
      const p = poly[Math.floor(Math.random() * poly.length)];
      tx = p.x + rand(-1.5, 1.5);
      ty = p.y + rand(-1.5, 1.5);
    } else {
      // 内部均匀撒点（拒绝采样，避免中间堆成一条）
      let ok = false;
      for (let k = 0; k < 60 && !ok; k++){
        const rx = rand(minX, maxX);
        const ry = rand(minY, maxY);
        if (insidePolygon(rx, ry, poly)){
          tx = rx; ty = ry; ok = true;
        }
      }
      if (!ok){ tx = W / 2; ty = CY; }
    }

    particles.push({
      x: rand(0, W), y: rand(0, H),
      tx, ty,
      r: onEdge ? rand(2.2, 3.8) : rand(1.1, 2.4),
      a: onEdge ? rand(0.75, 1) : rand(0.22, 0.6),
      ph: rand(0, Math.PI * 2),
      sp: rand(0.6, 1.8),
      vx: 0, vy: 0
    });
  }
  mode = 'form';
}

/* ---------- 飘落的心 ---------- */
let rain = [];
function spawnRain(n){
  for (let i = 0; i < n; i++){
    rain.push({
      x: rand(-20, W + 20),
      y: rand(-H * 0.3, -20),
      vy: rand(1.2, 3.2),
      vx: rand(-0.6, 0.6),
      size: rand(10, 26),
      rot: rand(-0.4, 0.4),
      vr: rand(-0.02, 0.02),
      a: rand(0.45, 0.9),
      hue: Math.random() < 0.5 ? '#ff6b88' : '#ffd0dc'
    });
  }
}

/* ---------- 主循环 ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(2, (now - last) / 16.67);
  last = now;

  ctx.clearRect(0, 0, W, H);

  // 深空底
  const bgGrad = ctx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, Math.max(W, H) * 0.75);
  bgGrad.addColorStop(0, 'rgba(30,14,40,1)');
  bgGrad.addColorStop(1, 'rgba(6,4,12,1)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 粒子
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles){
    if (mode === 'burst' || mode === 'drift'){
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (mode === 'burst'){
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.a *= 0.988;
      } else {
        // 缓缓散开：速度几乎不变，亮度慢慢褪去
        p.a *= 0.9865;
      }
      if (p.a < 0.02) continue;
    } else {
      const stiff = mode === 'calm' ? 0.012 : 0.05;
      p.x += (p.tx - p.x) * stiff * dt;
      p.y += (p.ty - p.y) * stiff * dt;
      p.x += Math.sin(now / 900 + p.ph) * 0.45 * dt;
      p.y += Math.cos(now / 1100 + p.ph) * 0.45 * dt;
    }
    const size = p.r * 5.2;
    ctx.globalAlpha = p.a * (0.75 + 0.25 * Math.sin(now / 700 + p.ph));
    ctx.drawImage(sprite, p.x - size / 2, p.y - size / 2, size, size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // 飘落的心
  for (const h of rain){
    h.x += h.vx * dt;
    h.y += h.vy * dt;
    h.rot += h.vr * dt;
    if (h.y > H + 40){
      h.y = -30;
      h.x = rand(-20, W + 20);
    }
    ctx.save();
    ctx.globalAlpha = h.a;
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    ctx.fillStyle = h.hue;
    ctx.font = h.size + 'px serif';
    ctx.fillText('❤', 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}

/* ---------- 打字机 ---------- */
const typeBox = document.getElementById('typeBox');

async function typeAll(){
  await sleep(600);
  for (let i = 0; i < CONFIG.script.length; i++){
    const line = CONFIG.script[i];
    if (i > 0){ typedEl.textContent += '\n'; }
    for (const ch of line){
      typedEl.textContent += ch;
      typeBox.scrollTop = typeBox.scrollHeight;
      await sleep(ch === '，' || ch === '。' ? 260 : rand(26, 52));
    }
    await sleep(420);
  }
  await sleep(1400);
  stage1.classList.add('hide');
  await sleep(700);
  stage2.classList.remove('hide');
}

/* ---------- 点“不愿意”：爱心缓缓散开 ---------- */
const stage4 = document.getElementById('stage4');
const byeText = document.getElementById('byeText');

noBtn.addEventListener('click', async () => {
  if (mode === 'drift') return;
  yesBtn.disabled = true;
  noBtn.disabled = true;

  // 每颗粒子沿自己的方向缓慢飘走，同时慢慢变淡
  mode = 'drift';
  for (const p of particles){
    const ang = Math.atan2(p.y - CY, p.x - W / 2) + rand(-0.5, 0.5);
    const speed = rand(0.15, 0.55);
    p.vx = Math.cos(ang) * speed;
    p.vy = Math.sin(ang) * speed - rand(0.05, 0.25);  // 略微上飘
  }

  stage2.classList.add('hide');
  fadeMusicOut(6);
  await sleep(4600);
  stage4.classList.remove('hide');
  await sleep(120);
  byeText.classList.add('on');
});

/* ---------- 点“愿意” ---------- */
yesBtn.addEventListener('click', async () => {
  yesBtn.disabled = true;
  mode = 'burst';
  for (const p of particles){
    const ang = Math.atan2(p.y - CY, p.x - W / 2);
    const speed = rand(2, 9);
    p.vx = Math.cos(ang) * speed * rand(0.4, 1.2);
    p.vy = Math.sin(ang) * speed * rand(0.4, 1.2);
  }
  spawnRain(70);
  sparkle();
  stage2.classList.add('hide');
  await sleep(800);
  stage3.classList.remove('hide');

  // 炸开后，爱心重新聚拢成心，作为背景静静发光
  setTimeout(() => {
    buildHeart();
    mode = 'calm';
    for (const p of particles){
      p.x = p.tx + rand(-W * 0.35, W * 0.35);
      p.y = p.ty + rand(-H * 0.35, H * 0.35);
    }
  }, 2200);
});

/* ---------- 背景音乐（Web Audio 实时合成：钢琴旋律 + 和弦垫 + 混响） ---------- */
let audioCtx = null, master = null, dryBus = null, wetBus = null;
let mOn = false, cycleTimer = null, nextCycle = 0;

const LOOP_LEN = 24;      // 一轮 24 秒，4 个和弦各 6 秒
const CHORDS = [
  [174.61, 220.00, 261.63, 329.63], // Fmaj7  F A C E
  [130.81, 164.81, 196.00, 246.94], // C      C E G B
  [146.83, 174.61, 220.00, 261.63], // Dm7    D F A C
  [116.54, 146.83, 174.61, 220.00]  // Bb     Bb D F A
];
// 旋律线（时间秒 → 音高），固定的乐句，不是随机音
const MELODY = [
  [0.9, 659.25], [2.4, 523.25], [3.8, 440.00],
  [6.9, 783.99], [8.4, 659.25], [9.8, 587.33],
  [12.9, 440.00], [14.4, 523.25], [15.8, 587.33],
  [18.9, 659.25], [20.4, 587.33], [21.8, 523.25], [23.0, 440.00]
];

// 混响：用一段噪声衰减当作脉冲响应
function makeReverb(ctx){
  const len = Math.floor(ctx.sampleRate * 1.5);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){
    const t = i / len;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.8);
  }
  const conv = ctx.createConvolver();
  conv.buffer = buf;
  return conv;
}

// 一个音：基频 + 二三次谐波，快起音、慢衰减，接近钢琴
function piano(when, freq, dur, amp){
  [[1, 1], [2, 0.32], [3, 0.14]].forEach(function(pair){
    const mult = pair[0], w = pair[1];
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * mult;
    const peak = amp * w;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g);
    g.connect(dryBus);
    g.connect(wetBus);
    osc.start(when);
    osc.stop(when + dur + 0.05);
  });
}

// 和弦垫：两个微失谐的三角波，慢慢起、慢慢收
function pad(when, freq, dur){
  [-7, 7].forEach(function(det){
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    osc.detune.value = det;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(0.010, when + 1.5);
    g.gain.linearRampToValueAtTime(0.0001, when + dur + 0.7);
    osc.connect(g);
    g.connect(dryBus);
    g.connect(wetBus);
    osc.start(when);
    osc.stop(when + dur + 0.9);
  });
}

function scheduleCycle(t0){
  CHORDS.forEach(function(ch, ci){
    const start = t0 + ci * 6;
    ch.forEach(function(f){ pad(start, f, 5.4); });
  });

  MELODY.forEach(function(note){ piano(t0 + note[0], note[1], 2.2, 0.05); });

  // 分解和弦伴奏：每 0.75 秒一个高八度音，很轻，只托一层
  const order = [1, 2, 0, 3];
  for (let i = 0; i < 32; i++){
    const off = i * 0.75 + 0.3;
    const ci = Math.floor(off / 6) % 4;
    const tone = CHORDS[ci][order[i % 4]];
    piano(t0 + off, tone * 2, 1.2, 0.014);
  }
}

function musicTick(){
  if (!mOn) return;
  const now = audioCtx.currentTime;
  while (nextCycle < now + 2){
    scheduleCycle(nextCycle);
    nextCycle += LOOP_LEN;
  }
  cycleTimer = setTimeout(musicTick, 500);
}

function startMusic(){
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();

  master = audioCtx.createGain();
  master.gain.setValueAtTime(0, audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(0.55, audioCtx.currentTime + 4);
  master.connect(audioCtx.destination);

  dryBus = audioCtx.createGain();
  dryBus.gain.value = 1.0;
  dryBus.connect(master);

  wetBus = audioCtx.createGain();
  wetBus.gain.value = 0.4;
  wetBus.connect(makeReverb(audioCtx));
  wetBus.connect(master);

  if (audioCtx.state === 'suspended') audioCtx.resume();
  mOn = true;
  nextCycle = audioCtx.currentTime + 0.2;
  musicTick();
}

// 答应时一小段上行音阶
function sparkle(){
  if (!audioCtx) return;
  [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50].forEach(function(f, i){
    piano(audioCtx.currentTime + i * 0.17, f, 1.2, 0.05);
  });
}

// 拒绝时让音乐慢慢淡出
function fadeMusicOut(sec){
  mOn = false;
  clearTimeout(cycleTimer);
  if (!audioCtx || !master) return;
  const t = audioCtx.currentTime;
  master.gain.cancelScheduledValues(t);
  master.gain.setValueAtTime(master.gain.value, t);
  master.gain.linearRampToValueAtTime(0, t + sec);
}
/* ---------- 开场页：轻触开始 ---------- */
const splash = document.getElementById('splash');
splash.addEventListener('click', async () => {
  splash.classList.add('hide');
  startMusic();
  stage1.classList.add('ready');
  await sleep(900);
  typeAll();
}, { once: true });

/* ---------- 启动 ---------- */
resize();
requestAnimationFrame(loop);
</script>
